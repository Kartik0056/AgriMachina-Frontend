<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cursorGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#60a5fa" />
      <stop offset="55%" stop-color="#f43f5e" />
      <stop offset="75%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <filter id="cursorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <g filter="url(#cursorShadow)">
    <!-- Main Arrow Body -->
    <path 
      d="M 6 4 L 46 29 L 27 34 L 19 54 Z" 
      fill="url(#cursorGrad)" 
      stroke="rgba(255,255,255,0.2)" 
      stroke-width="0.5"
      stroke-linejoin="round"
    />
    
    <!-- White Centerline Slit -->
    <line 
      x1="11" 
      y1="10" 
      x2="25" 
      y2="28" 
      stroke="#ffffff" 
      stroke-width="3" 
      stroke-linecap="round" 
    />
  </g>
</svg>
