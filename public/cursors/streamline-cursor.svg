<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="34" height="34" fill="none">
  <defs>
    <!-- Multi-stop Gradient matching the exact cyan-to-magenta-to-indigo gradient -->
    <linearGradient id="planeGrad" x1="10%" y1="0%" x2="75%" y2="95%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="22%" stop-color="#60a5fa" />
      <stop offset="48%" stop-color="#d946ef" />
      <stop offset="72%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="cursorShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.38" />
    </filter>
  </defs>

  <g filter="url(#cursorShadow)">
    <!-- Main Arrow / Paper Plane Body (Slightly wider wings) -->
    <path
      d="M 3 3 L 44 24 L 27 27 L 24 44 Z"
      fill="url(#planeGrad)"
      stroke="rgba(255, 255, 255, 0.3)"
      stroke-width="0.75"
      stroke-linejoin="round"
    />

    <!-- White Centerline Slit with rounded caps -->
    <line
      x1="8"
      y1="8"
      x2="24"
      y2="24"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>
</svg>
