<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <g filter="drop-shadow(0 2px 5px rgba(0,0,0,0.4))">
    <!-- Green Leaf Precision Pointer Stem pointing directly at 2, 2 -->
    <path d="M 2,2 L 13,13 L 8.5,14.5 L 13,23 L 10,24.5 L 5.5,16 L 1.5,19.5 Z" fill="#16a34a" stroke="#052e16" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 3,3 L 11,11 L 7.5,12.2" stroke="#86efac" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Mini Power Weeder / Tiller Machine -->
    <g transform="translate(12, 10)">
      <!-- Heavy Duty Engine Housing -->
      <rect x="5" y="4" width="12" height="9" rx="2" fill="#15803d" stroke="#052e16" stroke-width="1.4" />
      <rect x="7" y="6" width="8" height="5" rx="1" fill="#22c55e" />
      <path d="M 17,6 L 19,5 L 19,8" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round" />
      
      <!-- Steering Control Handles -->
      <path d="M 4,6 L 1,4 M 4,11 L 1,13" stroke="#052e16" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="1" cy="4" r="1" fill="#facc15" stroke="#052e16" stroke-width="0.8"/>
      <circle cx="1" cy="13" r="1" fill="#facc15" stroke="#052e16" stroke-width="0.8"/>

      <!-- Rotary Tiller Soil Blades -->
      <circle cx="11" cy="17" r="4.5" fill="#334155" stroke="#052e16" stroke-width="1.2" />
      <path d="M 11,13 Q 14,15 11,17 Q 8,19 11,21" stroke="#cbd5e1" stroke-width="1.2" fill="none"/>
      <path d="M 7,17 Q 9,14 11,17 Q 13,20 15,17" stroke="#cbd5e1" stroke-width="1.2" fill="none"/>
      <circle cx="11" cy="17" r="1.5" fill="#f59e0b" stroke="#052e16" stroke-width="0.8"/>
      
      <!-- Fresh Green Sprout Leaf -->
      <path d="M 16,14 C 18,11 21,12 21,12 C 21,12 21,15 17,17" fill="#4ade80" stroke="#052e16" stroke-width="0.8"/>
    </g>
  </g>
</svg>
