<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <defs>
    <!-- Rich Spring Green Gradient -->
    <linearGradient id="glitterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="35%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Clip Path for Cursor Shape -->
    <clipPath id="arrowClip">
      <path d="M 2,2 L 32,18 L 18,18 L 2,34 Z"/>
    </clipPath>

    <!-- 4-point Star Sparkle Symbol -->
    <g id="sparkleStar">
      <path d="M 0,-4 Q 0,0 4,0 Q 0,0 0,4 Q 0,0 -4,0 Q 0,0 0,-4 Z" fill="#ffffff" />
      <circle cx="0" cy="0" r="1.2" fill="#ffffff" />
    </g>
    <g id="smallStar">
      <path d="M 0,-2.5 Q 0,0 2.5,0 Q 0,0 0,2.5 Q 0,0 -2.5,0 Q 0,0 0,-2.5 Z" fill="#ffffff" opacity="0.9" />
    </g>
  </defs>

  <g filter="drop-shadow(0 3px 6px rgba(0,0,0,0.5))">
    <!-- Outer Border Path -->
    <path d="M 2,2 L 32,18 L 18,18 L 2,34 Z" fill="url(#glitterGrad)" stroke="#052e16" stroke-width="2" stroke-linejoin="round"/>

    <!-- Glitter Pattern Clipped to Arrow -->
    <g clip-path="url(#arrowClip)">
      <!-- Glitter Shimmer Speckles -->
      <circle cx="4" cy="6" r="0.7" fill="#ffffff" opacity="0.85"/>
      <circle cx="7" cy="4" r="0.9" fill="#bbf7d0" opacity="0.9"/>
      <circle cx="10" cy="8" r="0.6" fill="#ffffff" opacity="0.8"/>
      <circle cx="6" cy="11" r="0.8" fill="#dcfce7" opacity="0.9"/>
      <circle cx="9" cy="13" r="0.7" fill="#ffffff" opacity="0.85"/>
      <circle cx="13" cy="11" r="0.9" fill="#86efac" opacity="0.9"/>
      <circle cx="16" cy="14" r="0.8" fill="#ffffff" opacity="0.85"/>
      <circle cx="19" cy="16" r="0.7" fill="#dcfce7" opacity="0.9"/>
      <circle cx="22" cy="17" r="0.8" fill="#ffffff" opacity="0.85"/>
      <circle cx="26" cy="17" r="0.9" fill="#bbf7d0" opacity="0.9"/>
      <circle cx="29" cy="18" r="0.7" fill="#ffffff" opacity="0.8"/>
      <circle cx="5" cy="16" r="0.8" fill="#ffffff" opacity="0.85"/>
      <circle cx="8" cy="18" r="0.7" fill="#bbf7d0" opacity="0.8"/>
      <circle cx="12" cy="17" r="0.9" fill="#ffffff" opacity="0.9"/>
      <circle cx="15" cy="17" r="0.6" fill="#86efac" opacity="0.85"/>
      <circle cx="4" cy="21" r="0.9" fill="#ffffff" opacity="0.85"/>
      <circle cx="7" cy="23" r="0.7" fill="#dcfce7" opacity="0.85"/>
      <circle cx="10" cy="21" r="0.8" fill="#ffffff" opacity="0.9"/>
      <circle cx="3" cy="27" r="0.8" fill="#bbf7d0" opacity="0.85"/>
      <circle cx="6" cy="29" r="0.7" fill="#ffffff" opacity="0.8"/>
      <circle cx="3" cy="31" r="0.9" fill="#dcfce7" opacity="0.9"/>
      <circle cx="14" cy="15" r="0.7" fill="#ffffff" opacity="0.85"/>
      <circle cx="20" cy="15" r="0.8" fill="#bbf7d0" opacity="0.9"/>
      <circle cx="24" cy="16" r="0.7" fill="#ffffff" opacity="0.8"/>

      <!-- Glowing Star Glints (✦) as in screenshot -->
      <use href="#sparkleStar" x="8" y="9"/>
      <use href="#sparkleStar" x="22" y="16"/>
      <use href="#sparkleStar" x="14" y="14"/>
      <use href="#sparkleStar" x="8" y="24"/>
      <use href="#smallStar" x="5" y="5"/>
      <use href="#smallStar" x="27" y="17"/>
      <use href="#smallStar" x="11" y="18"/>
      <use href="#smallStar" x="5" y="30"/>
    </g>

    <!-- Crisp Highlight Edge -->
    <path d="M 3,3 L 30,17.5" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
