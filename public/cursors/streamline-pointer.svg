<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="37" height="37" fill="none">
  <defs>
    <!-- Vibrant Pointer Gradient -->
    <linearGradient id="pointerPlaneGrad" x1="10%" y1="0%" x2="75%" y2="95%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="20%" stop-color="#38bdf8" />
      <stop offset="48%" stop-color="#ec4899" />
      <stop offset="72%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Interactive Glow & Shadow (No Circle) -->
    <filter id="pointerGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#pointerGlow)">
    <!-- Main Arrow / Paper Plane Body (Same design, no circle) -->
    <path
      d="M 3 3 L 44 24 L 27 27 L 24 44 Z"
      fill="url(#pointerPlaneGrad)"
      stroke="#ffffff"
      stroke-width="0.85"
      stroke-linejoin="round"
    />

    <!-- White Centerline Slit with rounded caps -->
    <line
      x1="8"
      y1="8"
      x2="24"
      y2="24"
      stroke="#ffffff"
      stroke-width="3.2"
      stroke-linecap="round"
    />
  </g>
</svg>
