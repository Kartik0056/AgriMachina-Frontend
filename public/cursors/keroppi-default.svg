<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <g stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Party Hat -->
    <polygon points="12,13 14,4 20,10" fill="#facc15" stroke="#0f172a" stroke-width="1.8" />
    
    <!-- Big Round Eyes Background -->
    <circle cx="13.5" cy="16" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
    <circle cx="23.5" cy="15.5" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />

    <!-- Frog Head -->
    <path d="M 8.5,21.5 C 7.5,17 12,16 18.5,16 C 25,16 29.5,17 28.5,21.5 C 28.5,26.5 24.5,28 18.5,28 C 12.5,28 8.5,26.5 8.5,21.5 Z" fill="#9dd645" stroke="#0f172a" stroke-width="1.8" />

    <!-- Left Pupil with Glint -->
    <circle cx="13.5" cy="16" r="2.2" fill="#0f172a" stroke="none" />
    <circle cx="14.2" cy="15.2" r="0.7" fill="#ffffff" stroke="none" />

    <!-- Right Eye Wink (V-shape) -->
    <path d="M 21.5,16 L 24,14.5 L 24.5,17" fill="none" stroke="#0f172a" stroke-width="1.6" />

    <!-- Cheeks -->
    <circle cx="11" cy="22.5" r="1.8" fill="#fb7185" stroke="none" />
    <circle cx="26" cy="22" r="1.8" fill="#fb7185" stroke="none" />

    <!-- Smile -->
    <path d="M 16.5,23.8 Q 18.5,26 20.5,23.8" fill="none" stroke="#0f172a" stroke-width="1.4" />

    <!-- Striped Red & White Top -->
    <path d="M 13.5,27.5 L 12.5,31 L 24.5,30.5 L 23.5,27.5 Z" fill="#ef4444" stroke="#0f172a" stroke-width="1.6" />
    <path d="M 15.5,28 L 15,31 L 17.5,31 L 18,28 Z" fill="#ffffff" stroke="none" />
    <path d="M 20.2,28 L 20,30.8 L 21.8,30.8 L 22,28 Z" fill="#ffffff" stroke="none" />

    <!-- Cute Hands resting on tube -->
    <circle cx="11.5" cy="29" r="1.6" fill="#9dd645" stroke="#0f172a" stroke-width="1.4" />
    <circle cx="24.5" cy="28.5" r="1.6" fill="#9dd645" stroke="#0f172a" stroke-width="1.4" />

    <!-- Swim Ring (Green & White striped inflatable) -->
    <path d="M 7,30 C 7,35 11,37.5 18.5,37.5 C 26,37.5 30,34.5 30,30 C 30,28.5 28,28.5 26,29.5 C 22,30.5 15,30.5 11,29.5 C 9,28.5 7,28.5 7,30 Z" fill="#15803d" stroke="#0f172a" stroke-width="1.8" />
    <!-- White Stripe Left on Tube -->
    <path d="M 11.5,29.8 C 12,33 13,36.5 14.2,37.2 C 15.8,37.2 16.5,33.5 16.5,30.2 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
    <!-- White Stripe Right on Tube -->
    <path d="M 21.5,30 C 21.5,33.5 22.2,36.8 23.8,36.8 C 25,36.8 25.8,33 25.8,29.8 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.4" />
  </g>
</svg>
